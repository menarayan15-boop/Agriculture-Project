<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <!-- Water Drop Gradient (Jal) -->
    <linearGradient id="jalDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Crop & Leaf Gradient (Krishi) -->
    <linearGradient id="krishiLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Golden Grain & Sun Gradient (Effort & Harvest) -->
    <linearGradient id="harvestGoldGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Farmer Hands / Field Earth Gradient -->
    <linearGradient id="farmerSoilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Container / Outer Glow Ring -->
  <circle cx="100" cy="100" r="92" fill="#0A1910" stroke="url(#krishiLeafGrad)" stroke-width="3" opacity="0.95" />

  <!-- Background Rays / Rising Sun of Hope & Labor -->
  <g opacity="0.35">
    <path d="M100 100 L100 20 M100 100 L135 30 M100 100 L165 50 M100 100 L65 30 M100 100 L35 50" stroke="url(#harvestGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Rising Sun Curve -->
  <circle cx="100" cy="108" r="38" fill="url(#harvestGoldGrad)" opacity="0.25"/>
  <circle cx="100" cy="108" r="26" fill="url(#harvestGoldGrad)" opacity="0.4"/>

  <!-- Water Drop Background Outline (Jal - Liquid of Life) -->
  <path d="M100 22 C100 22 154 85 154 122 C154 152 130 176 100 176 C70 176 46 152 46 122 C46 85 100 22 100 22 Z"
        fill="url(#jalDropGrad)" opacity="0.2" stroke="url(#jalDropGrad)" stroke-width="2.5"/>

  <!-- Farmer's Caring Hands / Fertile Earth Soil Base Arc -->
  <path d="M42 130 C58 168 142 168 158 130 C146 160 118 174 100 174 C82 174 54 160 42 130 Z"
        fill="url(#farmerSoilGrad)"/>

  <!-- Left Cupping Hand / Field Ridge -->
  <path d="M44 126 C55 148 78 160 100 160 C80 156 60 144 48 122 Z"
        fill="url(#krishiLeafGrad)" opacity="0.7"/>

  <!-- Golden Wheat Ear Stalk (Right Side - Farmer's Sweat & Crop Harvest) -->
  <g stroke="url(#harvestGoldGrad)" stroke-width="2.5" stroke-linecap="round" fill="url(#harvestGoldGrad)">
    <!-- Main stem -->
    <path d="M100 152 Q112 120 126 72" fill="none"/>
    <!-- Wheat grains -->
    <path d="M126 72 C129 66 137 68 134 74 C130 79 124 77 126 72 Z"/>
    <path d="M121 84 C126 78 134 81 130 87 C125 91 119 88 121 84 Z"/>
    <path d="M116 98 C122 93 129 97 125 102 C120 106 114 102 116 98 Z"/>
    <path d="M110 112 C116 108 123 112 119 117 C114 121 108 117 110 112 Z"/>
    <!-- Awns / Bristles -->
    <path d="M126 72 L140 58" fill="none" stroke-width="1.8"/>
    <path d="M121 84 L138 72" fill="none" stroke-width="1.8"/>
    <path d="M116 98 L134 88" fill="none" stroke-width="1.8"/>
  </g>

  <!-- Green Crop Sprout Leaf (Left Side - Life & Agriculture) -->
  <path d="M100 152 C90 125 72 108 56 102 C56 118 70 140 100 152 Z"
        fill="url(#krishiLeafGrad)"/>
  <path d="M96 142 C84 122 75 106 62 96 C68 112 80 132 96 142 Z"
        fill="#34D399" opacity="0.6"/>

  <!-- Center Water Droplet Glistening in Sprout (Jal) -->
  <path d="M100 68 C100 68 116 94 116 108 C116 117 109 124 100 124 C91 124 84 117 84 108 C84 94 100 68 100 68 Z"
        fill="url(#jalDropGrad)" filter="url(#logoGlow)"/>

  <!-- Droplet Highlight / Reflection -->
  <ellipse cx="95" cy="100" rx="3.5" ry="7" transform="rotate(-25 95 100)" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="103" cy="114" r="2" fill="#FFFFFF" opacity="0.5"/>

  <!-- Tiny Sparkling Water Beads on Leaves (Symbol of Fresh Morning Dew & Dedicated Irrigation) -->
  <circle cx="68" cy="118" r="2.5" fill="#38BDF8"/>
  <circle cx="67" cy="117" r="1" fill="#FFFFFF"/>
  <circle cx="128" cy="106" r="2.2" fill="#FBBF24"/>
</svg>
